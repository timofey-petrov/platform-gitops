apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-user
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/timofey-petrov/platform-gitops.git
    targetRevision: main
    path: ops/grafana-user
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
