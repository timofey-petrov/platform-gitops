apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/timofey-petrov/platform-gitops.git
    targetRevision: main
    path: apps/demo-app/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
