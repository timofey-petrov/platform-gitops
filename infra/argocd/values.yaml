configs:
  params:
    server.insecure: true
  cm:
    accounts.readonly: login
  secret:
    accounts.readonly.password: "$2b$12$PI..x3.ChSAd4vQ.ClVfxOphXOlhc1.sJvmF7EdHoj95HDjBuCumm"
    accounts.readonly.passwordMtime: "2026-02-03T17:52:14Z"
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, readonly, role:readonly

server:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.platform-gitops.ru
    hosts:
      - argocd.platform-gitops.ru
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: true
    extraTls:
      - hosts:
          - argocd.platform-gitops.ru
        secretName: argocd-tls
